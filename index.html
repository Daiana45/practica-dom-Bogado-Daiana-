<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">            
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>
    <h1 class="text-center">MI GALERIA DE SUPERHEROE</h1>
    <form id="formAgregar" class="row g-2 mb-4">
  <div class="col-md-5">
    <input type="text" id="inputNombre" class="form-control" placeholder="Nombre del personaje" required>
  </div>
  <div class="col-md-5">
    <input type="url" id="inputImagen" class="form-control" placeholder="URL de la imagen" required>
  </div>
  <div class="col-md-2">
    <button type="submit" class="btn btn-primary w-100">Agregar</button>
  </div>
</form>
<div class="input-group mb-4">
  <input type="text" id="inputFiltro" class="form-control" placeholder="Buscar por nombre...">
  <button id="btnFiltrar" class="btn btn-secondary">Filtrar</button>
  <button id="btnLimpiar" class="btn btn-outline-secondary">Limpiar</button>
</div>
    <div id="contenedorCards" class="row row-cols-1 row-cols-md-3 g-4"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
</body>
</html>
